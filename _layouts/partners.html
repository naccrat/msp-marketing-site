{% include head.html %}
  <body data-bs-spy="scroll" data-bs-target="#navScroll">
  {% include nav.html %}
  <main>
    <section class="hw-page-hero">
      <div class="container">
        <div class="row align-items-center">
          <div class="col-lg-6 order-lg-2">
            <img src="/assets/images/{{ page.partner_logo }}" alt="{{ page.partner }}" class="img-fluid mb-4 w-50 hw-partner-logo" >
            <h1 class="hw-display">{{ page.title }}</h1>
            <p class="hw-lede">{{ page.description }}</p>
            <a class="hw-btn hw-btn-lg" href="{{ site.data.settings.basic_settings.register }}">
              Sign up to access your FREE software
            </a>
            <p class="small mt-3 mb-0 text-muted"><i class="bi bi-shield-check"></i> Free &mdash; No credit card required</p>
          </div>
          <div class="col-lg-6 order-lg-1 mt-4 mt-lg-0">
            <img src="/assets/images/{{ page.image }}" alt="{{ page.title }}" class="img-fluid" >
          </div>
        </div>
      </div>
    </section>
    {{ content }}
  </main>
  {% include footer.html %}
  </body>
</html>
