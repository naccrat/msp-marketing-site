<section id="request-access" class="hw-cta hw-section">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-8 text-center">
        <p class="hw-kicker">Get started</p>
        <h2>Request early access</h2>
        <p class="hw-lede mb-4">Be among the first to run your properties and entities from one clear place.</p>
        <form name="waitlist" netlify class="hw-access-form row g-2 justify-content-center align-items-stretch" action="/thank-you/">
          <input type="hidden" name="form-name" value="waitlist">

          <div class="col-12 col-md-5">
            <button type="submit" class="hw-btn">Request access</button>

      </div>
    </div>
  </div>
</section>
